<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Choose Subject</title>

  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Patrick Hand', cursive;
    }

    body{
      min-height:100vh;
      background:#f8f1df;
      overflow-x:hidden;
      position:relative;
      color:#4b2f24;
    }

    body::before{
      content:"";
      position:absolute;
      inset:0;
      background-image:
      radial-gradient(rgba(0,0,0,0.03) 1px, transparent 1px);

      background-size:18px 18px;
      opacity:0.5;
      z-index:-2;
    }

    .compass{
      position:absolute;
      bottom:20px;
      left:20px;
      width:160px;
      opacity:0.15;
    }

    .ship{
      position:absolute;
      right:20px;
      bottom:10px;
      width:140px;
      opacity:0.8;
    }

    .top-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 30px;
    }

    .back{
      font-size:24px;
      color:#5a4636;
      text-decoration:none;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .profile{
      width:60px;
      height:60px;
      border-radius:50%;
      overflow:hidden;
      border:3px solid #d9a066;
      box-shadow:0 4px 10px rgba(0,0,0,0.15);
    }

    .profile img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .container{
      text-align:center;
      padding:20px;
    }

    .hat{
      width:60px;
      margin-bottom:10px;
    }

    h1{
      font-size:58px;
      font-weight:500;
      margin-bottom:5px;
    }

    .subtitle{
      font-size:24px;
      color:#7a6b5d;
      margin-bottom:50px;
    }

    .cards{
      display:flex;
      justify-content:center;
      gap:35px;
      flex-wrap:wrap;
    }

    .card{
      width:290px;
      background:#fffaf0;
      border:2px solid #e4d2b8;
      border-radius:28px;
      padding:35px 20px;
      transition:0.3s ease;
      box-shadow:0 6px 18px rgba(0,0,0,0.08);
    }

    .card:hover{
      transform:translateY(-8px);
      box-shadow:0 10px 25px rgba(0,0,0,0.12);
    }

    .circle{
      width:140px;
      height:140px;
      margin:auto;
      border-radius:50%;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:60px;
      color:white;
      margin-bottom:25px;
    }

    .os{
      background:#4b93df;
    }

    .sds{
      background:#57a867;
    }

    .web{
      background:#e59a4a;
    }

    .card h2{
      font-size:44px;
      line-height:1.1;
      margin-bottom:25px;
    }

    .btn-link{
      text-decoration:none;
    }

    .btn{
      border:none;
      padding:12px 30px;
      border-radius:10px;
      color:white;
      font-size:22px;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      transform:scale(1.05);
    }

    .btn-os{
      background:#4b93df;
    }

    .btn-sds{
      background:#57a867;
    }

    .btn-web{
      background:#e59a4a;
    }

    @media(max-width:900px){

      h1{
        font-size:42px;
      }

      .subtitle{
        font-size:20px;
      }

      .card{
        width:85%;
      }

      .compass{
        width:110px;
      }

      .ship{
        width:100px;
      }

    }

  </style>

</head>
<body>

  <!-- TOP BAR -->

  <div class="top-bar">

    <a href="#" class="back">
      ← Back to Home
    </a>

    <div class="profile">

      <img 
        src="https://i.pinimg.com/736x/4e/89/89/4e8989a8db61c0d4f2db4c6d4dbf58c6.jpg"
        alt=""
      >

    </div>

  </div>

  <!-- MAIN -->

  <div class="container">

    <img
      class="hat"
      src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/61/Emoji_u1f9e2.svg/2048px-Emoji_u1f9e2.svg.png"
      alt=""
    >

    <h1>Choose a Subject</h1>

    <p class="subtitle">
      Select a subject to view practicals
    </p>

    <div class="cards">

      <!-- OS -->

      <div class="card">

        <div class="circle os">
          💻
        </div>

        <h2>
          Operating<br>System
        </h2>

        <a href="os.html" class="btn-link">

          <button class="btn btn-os">
            View Practicals
          </button>

        </a>

      </div>

      <!-- SDS -->

      <div class="card">

        <div class="circle sds">
          ⚙️
        </div>

        <h2>SDS</h2>

        <a href="sds.html" class="btn-link">

          <button class="btn btn-sds">
            View Practicals
          </button>

        </a>

      </div>

      <!-- WEB DEV -->

      <div class="card">

        <div class="circle web">
          &lt;/&gt;
        </div>

        <h2>
          Web<br>Development
        </h2>

        <a href="web.html" class="btn-link">

          <button class="btn btn-web">
            View Practicals
          </button>

        </a>

      </div>

    </div>

  </div>

  <!-- DECORATIONS -->

  <img
    class="compass"
    src="https://cdn-icons-png.flaticon.com/512/854/854878.png"
    alt=""
  >

  <img
    class="ship"
    src="https://cdn-icons-png.flaticon.com/512/1147/1147935.png"
    alt=""
  >

</body>
</html>
